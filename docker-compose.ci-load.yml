# Postgres on tmpfs, for the CI synthetic-load job and nothing else.
#
# The gate's job is to measure the service. Non-negotiable #8 makes every
# recommendation write a durable audit row, and ADR 0012 requires that commit to
# land before the response goes out, so every request — including the cold path
# that never reaches a model — pays for one `fdatasync` on whatever device
# Postgres's WAL sits on. On a GitHub runner that device is not ours and is not
# consistent: the first instrumented failing run spent 9,703 ms of WAL sync time
# across 3,085 syncs (3.15 ms per commit) while a passing run on the same code
# spent 723 ms across 3,385 (0.21 ms). Same image, same workload, a 15x
# difference in what a commit costs. See ADR 0010's 2026-08-28 note.
#
# So the runner's storage comes out of the measurement, the same way the job
# already stops the containers it does not measure and promotes the ones it
# does. What this file does NOT do is change durability semantics:
# `synchronous_commit` stays on, the commit still precedes the response, and the
# audit row is still written and read back by the gate's own checks. Only the
# medium underneath the WAL changes, and only inside CI. Commit cost on a real
# deployment is a property of that deployment's storage; it is measured there by
# the audit SLI `make prod-verify` prints and by the production canary, which is
# where a slow disk should surface.
#
# Applied only by the `synthetic-load-smoke` job, via `DEMO_COMPOSE_EXTRA` (see
# the Makefile). Local runs are on Docker Desktop's volume driver unless someone
# passes this file deliberately.
services:
  postgres:
    # Compose merges a service's `volumes` list by *target*, so this entry
    # replaces the base file's `postgres_data:/var/lib/postgresql/data` instead
    # of stacking beside it — which matters, because a named volume mounted over
    # the tmpfs would leave this file doing nothing at all while looking like it
    # worked. The `infra/postgres-init` bind mount has a different target and
    # survives the merge, so the `mlflow` database is still bootstrapped.
    #
    # Verify with:
    #   docker compose -f docker-compose.yml -f docker-compose.demo.yml \
    #     -f docker-compose.ci-load.yml config
    # The postgres service must show exactly one mount at that target, of
    # `type: tmpfs`, and no `type: volume` anywhere.
    #
    # The `postgres_data` volume stays declared at the top level of the base
    # file. Nothing mounts it under this overlay, so it is created empty and
    # never written to; removing a top-level declaration from an override is not
    # something Compose can express.
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
        tmpfs:
          # 4 GiB. The full 62,423-title fixture leaves 270 MiB in PGDATA. On an
          # arm64 reproduction its 499,384-row user-item query peaked at 832 MiB
          # total, including 690 MiB in base/pgsql_tmp; the amd64 CI planner
          # exceeded the old 2 GiB cap on that same spill. Doubling the observed
          # failing ceiling gives the architecture-dependent temp plan room
          # without weakening the fixture. The runner has 16 GB and tmpfs is
          # charged only as used, so this is a ceiling rather than a reservation.
          size: 4294967296
    # The image's entrypoint runs as root and does its own `mkdir -p`, `chown`
    # and `chmod 00700` on PGDATA, so a fresh tmpfs needs no uid/mode options
    # here — it is initialized exactly as an empty named volume would be.
